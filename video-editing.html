    <style>
/* ================================
   VIDEO PORTFOLIO
================================ */

.video-portfolio-section {
    background: #080808;
}

.video-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 2rem;
    margin-top: 3rem;
}

.video-card {
    overflow: hidden;
    background: #101010;
    border: 1px solid #1d1d1d;
    border-radius: 10px;

    transition:
        transform 0.35s ease,
        border-color 0.35s ease,
        box-shadow 0.35s ease;
}

.video-card:hover {
    transform: translateY(-6px);

    border-color: rgba(0, 255, 115, 0.4);

    box-shadow:
        0 15px 35px rgba(0, 0, 0, 0.45),
        0 0 25px rgba(0, 255, 115, 0.06);
}


/* Video */

.video-wrapper {
    width: 100%;
    height: 360px;
    background: #050505;
    overflow: hidden;
}

.video-wrapper video {
    width: 100%;
    height: 100%;

    display: block;

    object-fit: contain;
    background: #050505;
}


/* Info */

.video-info {
    min-height: 85px;

    padding: 18px 20px;

    display: flex;
    align-items: center;
    gap: 12px;
}

.video-number {
    color: #00e86b;

    font-size: 11px;
    font-weight: 700;
    letter-spacing: 1.5px;
}

.video-info h3 {
    margin: 0;

    color: #f5f5f5;

    font-family: Georgia, "Times New Roman", serif;

    font-size: 20px;
    font-weight: 500;
}


/* ================================
   MOBILE
================================ */

@media (max-width: 768px) {

    .video-grid {
        grid-template-columns: 1fr;
        gap: 1.5rem;
    }

    .video-wrapper {
        height: 300px;
    }
}


@media (max-width: 480px) {

    .video-wrapper {
        height: 250px;
    }

    .video-info {
        padding: 15px;
    }

    .video-info h3 {
        font-size: 18px;
    }
}
    </style>
</head>
