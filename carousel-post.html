    <style>
/* ================================
   PDF PORTFOLIO CARDS
================================ */

.pdf-card-link {
    text-decoration: none;
    color: inherit;
    display: block;
}

.pdf-card {
    position: relative;
    overflow: hidden;

    background: #0f0f0f;
    border: 1px solid #1c1c1c;
    border-radius: 10px;

    transition: all 0.35s ease;
}

.pdf-card:hover {
    transform: translateY(-7px);

    border-color: rgba(0, 255, 115, 0.45);

    box-shadow:
        0 15px 35px rgba(0, 0, 0, 0.45),
        0 0 25px rgba(0, 255, 115, 0.07);
}


/* PDF Preview */

.pdf-preview {
    height: 280px;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at center,
            rgba(0, 255, 115, 0.12),
            transparent 55%
        ),
        #0b0b0b;

    border-bottom: 1px solid #1c1c1c;

    transition: all 0.35s ease;
}

.pdf-preview i {
    font-size: 75px;
    color: #00e86b;

    filter: drop-shadow(
        0 0 18px rgba(0, 255, 115, 0.25)
    );

    transition: transform 0.35s ease;
}

.pdf-card:hover .pdf-preview i {
    transform: scale(1.1);
}


/* Content */

.pdf-content {
    min-height: 100px;

    padding: 20px;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.pdf-number {
    display: block;

    margin-bottom: 5px;

    color: #00e86b;

    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
}

.pdf-content h3 {
    margin: 0;

    color: #f5f5f5;

    font-family: Georgia, "Times New Roman", serif;

    font-size: 20px;
    font-weight: 500;
}

.pdf-arrow {
    width: 38px;
    height: 38px;

    display: flex;
    align-items: center;
    justify-content: center;

    border: 1px solid #292929;
    border-radius: 50%;

    color: #00e86b;

    transition: all 0.3s ease;
}

.pdf-card:hover .pdf-arrow {
    background: #00e86b;
    border-color: #00e86b;
    color: #080808;

    transform: rotate(45deg);
}


/* Mobile */

@media (max-width: 575px) {

    .pdf-preview {
        height: 250px;
    }

    .pdf-preview i {
        font-size: 65px;
    }

    .pdf-content {
        padding: 17px;
    }

    .pdf-content h3 {
        font-size: 18px;
    }
}
    </style>
